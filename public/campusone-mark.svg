<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#074E5B"/>
      <stop offset="50%" stop-color="#0B6B7B"/>
      <stop offset="100%" stop-color="#028497"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#032B33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Academic Graduation Cap (Top) -->
  <path d="M64 26 L98 42 L64 58 L30 42 Z" fill="#FFFFFF"/>
  <!-- Cap Trim / Dimension -->
  <path d="M64 47 L98 42 L64 58 L30 42 Z" fill="rgba(255,255,255,0.85)"/>
  
  <!-- Cap Skull Base & Tassel -->
  <path d="M46 51 L46 64 C46 72 82 72 82 64 L82 51 L64 60 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <!-- Tassel ribbon & bead -->
  <path d="M90 44 L95 62 L97 62 L93 43" fill="url(#goldGrad)"/>
  <circle cx="96" cy="64" r="3" fill="url(#goldGrad)"/>

  <!-- Open Book & Pillar Wings (Bottom) -->
  <!-- Left Page -->
  <path d="M64 88 C52 79 38 79 26 82 L26 100 C38 97 52 97 64 105 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Right Page -->
  <path d="M64 88 C76 79 90 79 102 82 L102 100 C90 97 76 97 64 105 Z" fill="#FFFFFF" opacity="0.85"/>
  <!-- Center Book Spine -->
  <line x1="64" y1="88" x2="64" y2="105" stroke="#074E5B" stroke-width="2" stroke-linecap="round"/>

  <!-- Center '1' Star / Spark of Learning -->
  <path d="M64 69 L66 74 L71 76 L66 78 L64 83 L62 78 L57 76 L62 74 Z" fill="url(#goldGrad)"/>
</svg>
